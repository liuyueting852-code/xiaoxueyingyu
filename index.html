<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单词训练营 · 五词四轮</title>
<style>
  :root{
    --board:#17332C;        /* 黑板深绿 */
    --board-2:#1E4038;      /* 稍亮的板面 */
    --card:#24473E;         /* 卡片 */
    --chalk:#F2EFE4;        /* 粉笔白 */
    --chalk-dim:#B9C4B8;    /* 次级文字 */
    --amber:#E8C468;        /* 粉笔黄(计时/强调) */
    --ok:#8CD0A9;           /* 正确 */
    --bad:#E58B7B;          /* 错误 */
    --line:rgba(242,239,228,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 70% -10%, rgba(232,196,104,.06), transparent 60%),
      var(--board);
    color:var(--chalk);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px}
  header.top{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
  .brand{font-size:20px;letter-spacing:2px;font-weight:700}
  .brand small{display:block;font-size:11px;color:var(--chalk-dim);letter-spacing:4px;font-weight:400;margin-top:2px}
  .navbtn{background:none;border:1px solid var(--line);color:var(--chalk-dim);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
  .navbtn:hover{color:var(--chalk);border-color:var(--chalk-dim)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .card h3{font-size:14px;letter-spacing:2px;color:var(--amber);margin-bottom:10px;font-weight:600}
  .muted{color:var(--chalk-dim);font-size:13px}

  .btn{display:inline-block;border:none;border-radius:10px;padding:12px 20px;font-size:15px;cursor:pointer;font-family:inherit}
  .btn-main{background:var(--amber);color:#2B2410;font-weight:700}
  .btn-main:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--chalk)}
  .btn-ghost:hover{border-color:var(--amber);color:var(--amber)}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* ===== 训练界面 ===== */
  .stage{min-height:60vh;display:flex;flex-direction:column;align-items:center;text-align:center}
  .round-tag{font-size:12px;letter-spacing:3px;color:var(--chalk-dim);margin-bottom:4px}
  .round-name{font-size:17px;color:var(--amber);letter-spacing:2px;margin-bottom:18px}
  .progress-dots{display:flex;gap:8px;margin-bottom:22px}
  .dot{width:10px;height:10px;border-radius:50%;border:1px solid var(--chalk-dim)}
  .dot.on{background:var(--amber);border-color:var(--amber)}
  .dot.done-ok{background:var(--ok);border-color:var(--ok)}
  .dot.done-bad{background:var(--bad);border-color:var(--bad)}

  .ring-wrap{position:relative;width:230px;height:230px;margin-bottom:18px}
  .ring-wrap svg{transform:rotate(-90deg)}
  .ring-bg{fill:none;stroke:rgba(242,239,228,.12);stroke-width:6}
  .ring-fg{fill:none;stroke:var(--amber);stroke-width:6;stroke-linecap:round;transition:stroke .3s}
  .ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .word-en{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:34px;font-weight:700;letter-spacing:1px;line-height:1.25;max-width:100%}
  .ph-word{white-space:nowrap}
  .ph-word>span{padding:0 1px}
  .ph-v{color:var(--amber);border-bottom:3px solid var(--amber)}
  .ph-c{color:var(--ok);border-bottom:3px solid var(--ok)}
  .ph-s{color:var(--chalk-dim);opacity:.5}
  .ph-hi{background:rgba(232,196,104,.32);box-shadow:0 0 14px rgba(232,196,104,.4);border-radius:5px;transition:background .12s}
  .ph-legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--chalk-dim);margin-bottom:10px}
  .ph-legend i{font-style:normal;padding:0 4px;border-bottom:3px solid}
  .ph-legend .lv{color:var(--amber);border-color:var(--amber)}
  .ph-legend .lc{color:var(--ok);border-color:var(--ok)}
  .ph-legend .ls{color:var(--chalk-dim);opacity:.6;border-color:transparent}
  .word-zh{font-size:18px;color:var(--chalk-dim);margin-top:6px}
  .timeleft{font-size:12px;color:var(--chalk-dim);margin-top:8px;font-variant-numeric:tabular-nums}
  .hidden-word{font-size:34px;letter-spacing:6px;color:var(--chalk-dim)}

  input.spell{
    width:min(420px,90%);background:var(--board-2);border:1px solid var(--line);border-radius:10px;
    color:var(--chalk);font-family:ui-monospace,Consolas,monospace;font-size:24px;text-align:center;
    padding:12px;letter-spacing:2px;outline:none;margin-bottom:14px
  }
  input.spell:focus{border-color:var(--amber)}
  input.spell.ok{border-color:var(--ok);color:var(--ok)}
  input.spell.bad{border-color:var(--bad);color:var(--bad)}
  .feedback{min-height:28px;font-size:16px;margin-bottom:10px}
  .feedback .ok{color:var(--ok)} .feedback .bad{color:var(--bad)}
  .correct-reveal{font-family:ui-monospace,Consolas,monospace;font-size:20px;color:var(--amber);letter-spacing:2px}

  /* ===== 列表/表格 ===== */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--chalk-dim);font-weight:400;font-size:12px;letter-spacing:1px}
  td .en{font-family:ui-monospace,Consolas,monospace}
  .tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--chalk-dim)}
  .tag.due{border-color:var(--amber);color:var(--amber)}
  .tag.okc{border-color:var(--ok);color:var(--ok)}
  .del{background:none;border:none;color:var(--chalk-dim);cursor:pointer;font-size:14px}
  .del:hover{color:var(--bad)}
  textarea{width:100%;min-height:110px;background:var(--board-2);border:1px solid var(--line);border-radius:10px;color:var(--chalk);padding:10px;font-size:14px;font-family:inherit;outline:none}
  textarea:focus{border-color:var(--amber)}

  /* 纸面批改 */
  .paper-list{counter-reset:pw;text-align:left;margin:10px 0 18px}
  .paper-item{display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px dashed var(--line)}
  .paper-item .num{color:var(--chalk-dim);width:22px}
  .paper-item .zh{flex:1;font-size:17px}
  .paper-item .en{font-family:ui-monospace,Consolas,monospace;font-size:17px;color:var(--amber);letter-spacing:1px}
  .markbtns{display:flex;gap:6px}
  .mk{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--chalk-dim);font-size:17px;cursor:pointer}
  .mk.sel-ok{background:var(--ok);color:#123;border-color:var(--ok)}
  .mk.sel-bad{background:var(--bad);color:#311;border-color:var(--bad)}

  .score-big{font-size:52px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums}
  .summary-word{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line);font-size:15px}
  .summary-word .en{font-family:ui-monospace,Consolas,monospace}
  .rate-row{display:flex;gap:10px;justify-content:center;margin-top:6px}
  .footer-tip{margin-top:26px;font-size:12px;color:var(--chalk-dim);text-align:center}
  @media (max-width:480px){ .ring-wrap{width:200px;height:200px} .word-en{font-size:28px} }

let state = {
  words: [],          // {id, en, zh}
  groups: [],         // {id, wordIds:[..5], learnedAt:'YYYY-MM-DD', stage:0, nextDue:'YYYY-MM-DD', graduated:false}
  nextId: 1
};

// 双通道存储:Claude 环境用 window.storage;下载到本地/挂到网站时自动改用浏览器 localStorage
const store = {
  async get(k){
    try{ const r = await window.storage.get(k); if(r && r.value!=null) return r.value; }catch(e){}
    try{ const v = localStorage.getItem(k); if(v!=null) return v; }catch(e){}
    return null;
  },
  async set(k,v){
    let ok=false;
    try{ const r = await window.storage.set(k,v); if(r) ok=true; }catch(e){}
    try{ localStorage.setItem(k,v); ok=true; }catch(e){}
    return ok;
  }
};

function todayStr(offset=0){ const d=new Date(); d.setDate(d.getDate()+offset); return d.toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

async function loadState(){
  try{
    const v = await store.get(STORE_KEY);
    if(v){
      state = JSON.parse(v);
      // 迁移:把词库新增的默认词补进已有存档(按单词去重,保留原进度)
      const have = new Set(state.words.map(w=>w.en.toLowerCase()));
      let added = 0;
      for(const [en,zh,u] of DEFAULT_WORDS){
        if(!have.has(en.toLowerCase())){
          state.words.push({id:state.nextId++, en, zh, u:u||''});
          have.add(en.toLowerCase()); added++;
        }
      }
      if(added) await saveState();
      return;
    }
  }catch(e){ /* 无存档或不可用 */ }
  // 首次:载入默认词库
  state.words = DEFAULT_WORDS.map(([en,zh,u])=>({id:state.nextId++, en, zh, u:u||''}));
  saveState();
}
async function saveState(){
  storageOK = await store.set(STORE_KEY, JSON.stringify(state));
}

function unlearnedWords(){
  const used = new Set(state.groups.flatMap(g=>g.wordIds));
  return state.words.filter(w=>!used.has(w.id));
}
function dueGroups(){
  const t = todayStr();
  return state.groups.filter(g=>!g.graduated && g.nextDue <= t);
}

/* ===== 暑假计划(2026-07-20 → 2026-08-31)===== */
const PLAN_START='2026-07-20', PLAN_END='2026-08-31';
function planPerDay(ds){
  const dow = new Date(ds+'T12:00:00').getDay(); // 0=周日
  if(ds<=('2026-07-26')) return 1;                        // 第1周 适应期
  if(ds<=('2026-08-23')) return dow===0 ? 0 : 2;          // 第2–5周 主力期,周日只复习
  return 1;                                               // 最后1周 收尾期
}
function planPhase(ds){
  if(ds<=('2026-07-26')) return '适应期 · 每天1组';
  if(ds<=('2026-08-23')) return '主力期 · 每天2组,周日只复习';
  return '收尾期 · 每天1组,重心转复习';
}
function planInfo(){
  const t = todayStr();
  if(t < PLAN_START) return null;
  let cumTarget=0, total=0;
  const d = new Date(PLAN_START+'T12:00:00');
  while(true){
    const ds = d.toISOString().slice(0,10);
    if(ds > PLAN_END) break;
    total += planPerDay(ds);
    if(ds <= t) cumTarget += planPerDay(ds);
    d.setDate(d.getDate()+1);
  }
  const actual = state.groups.filter(g=>g.learnedAt >= PLAN_START).length;
  return {
    over: t > PLAN_END,
    dayIdx: daysBetween(PLAN_START, t>PLAN_END?PLAN_END:t)+1,
    todayN: t<=PLAN_END ? planPerDay(t) : 0,
    phase: planPhase(t<=PLAN_END?t:PLAN_END),
    cumTarget, total, actual, diff: actual-cumTarget
  };
}
function wordById(id){ return state.words.find(w=>w.id===id); }

/* ================= 自然拼读 ================= */
// 把单词切成拼读块:v=元音发音块(黄) c=辅音组合(绿) b=辅音连缀 s=不发音 p=普通
const PH_PATS = [
  ['eigh','v'],['augh','v'],['ough','v'],
  ['igh','v'],['tch','c'],['dge','c'],['ear','v'],['air','v'],['oor','v'],['are','v'],['ure','v'],['alk','v'],['all','v'],['ore','v'],
  ['ch','c'],['sh','c'],['th','c'],['ph','c'],['wh','c'],['ck','c'],['ng','c'],['qu','c'],
  ['ai','v'],['ay','v'],['ea','v'],['ee','v'],['ei','v'],['ey','v'],['oa','v'],['ow','v'],['ou','v'],['oo','v'],['ue','v'],['ui','v'],['ie','v'],['oy','v'],['oi','v'],['aw','v'],['au','v'],['ew','v'],
  ['ar','v'],['er','v'],['ir','v'],['or','v'],['ur','v'],
  ['bl','b'],['br','b'],['cl','b'],['cr','b'],['dr','b'],['fl','b'],['fr','b'],['gl','b'],['gr','b'],['pl','b'],['pr','b'],['sc','b'],['sk','b'],['sl','b'],['sm','b'],['sn','b'],['sp','b'],['st','b'],['sw','b'],['tr','b'],['tw','b']
];
function phChunks(word){
  const res=[], lower=word.toLowerCase();
  let i=0;
  while(i<lower.length){
    const ch=lower[i];
    if(!/[a-z]/.test(ch)){ res.push({t:word[i],c:'p'}); i++; continue; }
    let hit=null;
    for(const [p,c] of PH_PATS){ if(lower.startsWith(p,i)){ hit=[p,c]; break; } }
    if(hit){ res.push({t:word.slice(i,i+hit[0].length), c:hit[1]}); i+=hit[0].length; }
    else { res.push({t:word[i], c:('aeiou'.includes(ch)||(ch==='y'&&i>0))?'v':'p'}); i++; }
  }
  // 词尾不发音的 e(magic e):辅音+e 结尾且前面已有元音块
  if(res.length>=3){
    const last=res[res.length-1], prev=res[res.length-2];
    if(last.t.toLowerCase()==='e' && last.c==='v' && prev.c!=='v'
       && res.slice(0,-2).some(x=>x.c==='v')) last.c='s';
  }
  return res;
}
function phHTML(word){
  return word.split(' ').map(part=>
    '<span class="ph-word">'+phChunks(part).map(k=>`<span class="ph-${k.c}">${k.t}</span>`).join('')+'</span>'
  ).join(' ');
}
// 根据词长自适应字号,保证在圆圈内显示完整
function enFontSize(en){
  const parts = en.split(' ');
  const longest = Math.max(...parts.map(p=>p.length));
  let size;
  if(longest<=6) size=34; else if(longest<=8) size=30; else if(longest<=10) size=26;
  else if(longest<=12) size=22; else size=18;
  if(parts.length>=2) size = Math.min(size, en.length>=16 ? 20 : 24);
  return size;
}

/* ================= 语音 ================= */
function speak(text, rate=0.85){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=rate;
    const v = speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
// 朗读序列:按 rates 依次朗读,遍与遍之间停 gap 毫秒;切词/退出时自动中断
let speakToken = 0;
function speakRepeat(text, rates, gap=600, onEach=null){
  try{
    speechSynthesis.cancel();
    const token = ++speakToken;
    let i = 0;
    const next = ()=>{
      if(token !== speakToken || i >= rates.length) return;
      const r = rates[i]; i++;
      const u = new SpeechSynthesisUtterance(text);
      u.lang='en-US'; u.rate = r;
      const v = speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));
      if(v) u.voice = v;
      u.onstart = ()=>{ if(token===speakToken && onEach) onEach(r); };
      u.onend = ()=>setTimeout(next, gap);
      speechSynthesis.speak(u);
    };
    next();
  }catch(e){}
}

// 跟读高亮:按语速估算时长,拼读块依次点亮
let hiTimers = [];
function clearHi(){
  hiTimers.forEach(clearTimeout); hiTimers=[];
  document.querySelectorAll('.ph-hi').forEach(e=>e.classList.remove('ph-hi'));
}
function animateChunks(rate){
  clearHi();
  const spans = [...document.querySelectorAll('#wordEn .ph-word > span')];
  if(!spans.length) return;
  const weights = spans.map(sp=> sp.classList.contains('ph-s') ? 0.35 : Math.max(sp.textContent.trim().length, 0.5));
  const totalW = weights.reduce((a,b)=>a+b, 0);
  const cps = 11 * rate;                                   // 估算每秒读的字符数
  const totalMs = Math.min(6000, Math.max(500, totalW/cps*1000));
  let t = 0;
  spans.forEach((sp,i)=>{
    const dur = totalMs * weights[i] / totalW;
    hiTimers.push(setTimeout(()=>{
      document.querySelectorAll('.ph-hi').forEach(e=>e.classList.remove('ph-hi'));
      sp.classList.add('ph-hi');
    }, t));
    t += dur;
  });
  hiTimers.push(setTimeout(clearHi, t + 150));
}
// 手动重听(带高亮)
function readAloud(rate){
  const w = S && S.queue[S.idx];
  if(!w) return;
  speakRepeat(w.en, [rate], 0, r=>animateChunks(r));
}

      <p class="muted">按艾宾浩斯遗忘曲线,每组学完后在第 <b style="color:var(--amber)">1 / 2 / 4 / 7 / 15</b> 天各复习一次;复习正确率不足 80% 时该阶段重来。5 次全部通过即标记为「已牢记」。</p>
    </div>
    ${storageOK?'':'<p class="footer-tip">⚠ 存储不可用,本次进度仅保留在当前页面内</p>'}
    <p class="footer-tip">建议戴耳机或打开声音 · 单词由浏览器语音朗读</p>`;
}

/* ---------- 词库管理 ---------- */
function renderBank(){
  clearTimer();
  const used = new Set(state.groups.flatMap(g=>g.wordIds));
  const rows = state.words.map(w=>`<tr>
    <td class="en">${w.en}</td><td>${w.zh}</td>
    <td>${w.u?`<span class="tag">${w.u}</span>`:''}</td>
    <td>${used.has(w.id)?'<span class="tag okc">已学</span>':'<span class="tag">待学</span>'}</td>
    <td>${used.has(w.id)?'':`<button class="del" onclick="delWord(${w.id})">✕</button>`}</td>
  </tr>`).join('');
  app.innerHTML = header('renderHome') + `
    <div class="card">
      <h3>批量添加单词</h3>
      <p class="muted" style="margin-bottom:8px">每行一个,格式:<b>英文 中文</b>(空格或逗号分隔),例如:<br>apple 苹果<br>give up 放弃</p>
      <textarea id="bulk" placeholder="apple 苹果&#10;banana 香蕉"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn btn-main btn-sm" onclick="bulkAdd()">添加到词库</button>
        <span class="muted" id="bulkMsg"></span>
      </div>
    </div>
    <div class="card">
      <h3>进度备份</h3>
      <p class="muted" style="margin-bottom:10px">进度会在每个动作后自动保存在当前设备/浏览器里。换设备或换浏览器时,用下面按钮把进度带走:</p>
      <div class="row">
        <button class="btn btn-ghost btn-sm" onclick="exportBackup()">⬇ 导出备份文件</button>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('impFile').click()">⬆ 导入备份文件</button>
        <input type="file" id="impFile" accept=".json" style="display:none" onchange="importBackup(this)">
        <span class="muted" id="bakMsg"></span>
      </div>
    </div>
    <div class="card">
      <h3>词库(${state.words.length})</h3>
      <table><tr><th>单词</th><th>释义</th><th>单元</th><th>状态</th><th></th></tr>${rows}</table>
    </div>`;
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `单词训练营备份-${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  document.getElementById('bakMsg').textContent = '已导出 ✓';
}
function importBackup(input){
  const f = input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try{
      const s = JSON.parse(rd.result);
      if(!s.words || !Array.isArray(s.words)) throw 0;
      state = s;
      await saveState();
      document.getElementById('bakMsg').textContent = '导入成功,进度已恢复 ✓';
      setTimeout(renderBank, 800);
    }catch(e){ document.getElementById('bakMsg').textContent = '文件格式不对,导入失败'; }
  };
  rd.readAsText(f);
}
function bulkAdd(){
  const lines = document.getElementById('bulk').value.split('\n').map(s=>s.trim()).filter(Boolean);
  let n=0;
  for(const line of lines){
    const m = line.match(/^([A-Za-z][A-Za-z .'-]*?)[\s,，、\t]+(.+)$/);
    if(m){
      const en=m[1].trim(), zh=m[2].trim();
      if(!state.words.some(w=>w.en.toLowerCase()===en.toLowerCase())){
        state.words.push({id:state.nextId++, en, zh}); n++;
      }
    }
  }
  saveState();
  document.getElementById('bulkMsg').textContent = n?`已添加 ${n} 个`: '未识别到有效行';
  if(n) setTimeout(renderBank, 600);
}
function delWord(id){
  state.words = state.words.filter(w=>w.id!==id);
  saveState(); renderBank();
}

/* ================= 训练会话 ================= */
let S = null; // session

function startNewGroup(){
  const all = unlearnedWords();
  if(!all.length) return;
  // 同主题(标签)优先凑满5个,不足再按顺序补位
  const tag = all[0].u;
  let pool = all.filter(w=>w.u===tag).slice(0,5);
  if(pool.length<5){
    const ids = new Set(pool.map(w=>w.id));
    for(const w of all){ if(pool.length>=5) break; if(!ids.has(w.id)) pool.push(w); }
  }
  S = { mode:'new', words:pool, round:1, idx:0, queue:[...pool],
        results:{}, marks:{} };
  pool.forEach(w=>S.results[w.id]={r1:null,r2:null,r3:null,r4:null});
  renderRound();
}

function startReview(gid){
  const g = state.groups.find(x=>x.id===gid);
  const ws = g.wordIds.map(wordById).filter(Boolean);
  S = { mode:'review', gid, words:ws, round:3, idx:0, queue:[...ws], results:{}, marks:{} };
  ws.forEach(w=>S.results[w.id]={r3:null});
  renderRound();
}

const ROUND_INFO = {
  1:{name:'第一轮 · 朗读跟读', time:30, tip:'自动播放:慢读3遍 → 快读3遍 → 慢1遍 → 快1遍,跟着色块拼读;黄=元音块 绿=辅音组合 灰=不发音'},
  2:{name:'第二轮 · 听音拼写', time:45, tip:'英文已隐藏,会自动慢读3遍,边听边拼出单词'},
  3:{name:'第三轮 · 中译英拼写', time:30, tip:'只看中文,拼出英文'},
};

function dots(){
  return `<div class="progress-dots">${S.queue.map((w,i)=>{
    let c='dot'; if(i<S.idx) c+=' done-ok'; else if(i===S.idx) c+=' on';
    return `<div class="${c}"></div>`;
  }).join('')}</div>`;
}

function renderRound(){
  clearTimer();
  if(S.round===4){ renderPaper(); return; }
  if(S.idx >= S.queue.length){ nextRoundOrRetry(); return; }
  const w = S.queue[S.idx];
  const info = ROUND_INFO[S.round];
  const R = 108, C = 2*Math.PI*R;
  const roundTag = S.mode==='review' ? '复习模式' : `新学 · 共 ${S.words.length} 词`;

  let inner='', controls='';
  if(S.round===1){
    inner = `<div class="word-en" id="wordEn" style="font-size:${enFontSize(w.en)}px">${phHTML(w.en)}</div><div class="word-zh">${w.zh}</div><div class="timeleft" id="tl"></div>`;
    controls = `
      <div class="ph-legend"><i class="lv">元音发音块</i><i class="lc">辅音组合</i><i class="ls">不发音</i></div>
      <div class="row" style="justify-content:center;margin-bottom:10px">
        <button class="btn btn-ghost btn-sm" onclick="readAloud(0.9)">🔊 正常语速</button>
        <button class="btn btn-ghost btn-sm" onclick="readAloud(0.45)">🐢 慢速拼读</button>
        ${recogAvailable?`<button class="btn btn-ghost btn-sm" id="micBtn" onclick="micScore()">🎤 跟读评分</button>`:''}
      </div>
      <div class="feedback" id="fb"></div>
      <p class="muted">按色块拼读:先慢速跟着拼,再正常语速连读,然后自评:</p>
      <div class="rate-row">
        <button class="btn btn-ghost btn-sm" onclick="rateR1(100)">😀 流利标准</button>
        <button class="btn btn-ghost btn-sm" onclick="rateR1(70)">🙂 基本会读</button>
        <button class="btn btn-ghost btn-sm" onclick="rateR1(40)">😣 还不熟</button>
      </div>`;
  } else {
    const showZh = true;
    const dotN = Math.min(w.en.replace(/\s/g,'').length,10);
    const dotSize = dotN<=6?34 : dotN<=8?28 : 22;
    inner = `<div class="hidden-word" style="font-size:${dotSize}px">${'•'.repeat(dotN)}</div>
             ${showZh?`<div class="word-zh">${w.zh}</div>`:''}
             <div class="timeleft" id="tl"></div>`;
    controls = `
      ${S.round===2?`<div class="row" style="justify-content:center;margin-bottom:10px">
        <button class="btn btn-ghost btn-sm" onclick="speak('${w.en.replace(/'/g,"\\'")}')">🔊 再听一遍</button></div>`:''}
      <input class="spell" id="spell" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="输入英文,回车提交" onkeydown="if(event.key==='Enter')checkSpell()">
      <div class="feedback" id="fb"></div>
      <button class="btn btn-main btn-sm" onclick="checkSpell()">提交</button>`;
  }

  app.innerHTML = header('renderHome') + `
    <div class="stage">
      <div class="round-tag">${roundTag}</div>
      <div class="round-name">${info.name}</div>
      ${dots()}
      <div class="ring-wrap">
        <svg width="100%" height="100%" viewBox="0 0 230 230">
          <circle class="ring-bg" cx="115" cy="115" r="${R}"></circle>
          <circle class="ring-fg" id="ring" cx="115" cy="115" r="${R}"
                  stroke-dasharray="${C}" stroke-dashoffset="0"></circle>
        </svg>
        <div class="ring-inner">${inner}</div>
      </div>
      ${controls}
      <p class="footer-tip">${info.tip}</p>
    </div>`;

  // 朗读:第一轮 慢3遍→正常3遍→慢1遍→正常1遍;第二轮 慢读3遍(遍间留2秒拼写)
  if(S.round===1) setTimeout(()=>speakRepeat(w.en, [0.45,0.45,0.45, 0.9,0.9,0.9, 0.45, 0.9], 700, r=>animateChunks(r)), 300);
  if(S.round===2) setTimeout(()=>speakRepeat(w.en, [0.45,0.45,0.45], 2000), 300);
  if(S.round>=2) setTimeout(()=>{const i=document.getElementById('spell'); if(i) i.focus();}, 100);

  // 计时
  let left = info.time*10; const total=left;
  const ring=document.getElementById('ring'), tl=document.getElementById('tl');
  timerHandle = setInterval(()=>{
    left--;
    if(tl) tl.textContent = (left/10).toFixed(1)+' s';
    if(ring){
      ring.style.strokeDashoffset = C*(1-left/total);
      if(left<total*0.25) ring.style.stroke='var(--bad)';
    }
    if(left<=0){ clearTimer(); onTimeout(w); }
  },100);
}

function onTimeout(w){
  if(S.round===1){ S.results[w.id].r1 = 40; advance(); }
  else {
    recordSpell(w, false);
    enterCorrection(w, '⏱ 超时!正确拼写:');
  }
}

function rateR1(score){
  const w=S.queue[S.idx];
  S.results[w.id].r1=score; clearTimer(); advance();
}

function micScore(){
  const w=S.queue[S.idx];
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  const fb=document.getElementById('fb');
  try{
    const r=new SR(); r.lang='en-US'; r.maxAlternatives=3;
    fb.innerHTML='<span class="muted">🎤 请跟读…</span>';
    r.onresult=e=>{
      const alts=[...e.results[0]].map(a=>a.transcript.toLowerCase().trim());
      const hit=alts.some(t=>t.includes(w.en.toLowerCase()));
      const score = hit?100:55;
      fb.innerHTML = hit?`<span class="ok">✓ 发音识别正确!100 分</span>`
                        :`<span class="bad">识别到:"${alts[0]}",再试或自评</span>`;
      if(hit){ S.results[w.id].r1=100; clearTimer(); setTimeout(advance,900); }
    };
    r.onerror=()=>{ fb.innerHTML='<span class="muted">麦克风不可用,请用下方按钮自评</span>'; recogAvailable=false; };
    r.start();
  }catch(e){
    fb.innerHTML='<span class="muted">麦克风不可用,请用下方按钮自评</span>';
    recogAvailable=false;
  }
}

function normSpell(s){ return s.toLowerCase().replace(/[^a-z]/g,''); }
function enterCorrection(w, msg){
  S.correcting = true;
  const input=document.getElementById('spell'), fb=document.getElementById('fb');
  if(input){ input.value=''; input.disabled=false; input.classList.remove('ok','bad'); input.focus(); }
  if(fb) fb.innerHTML = `<span class="bad">${msg}</span> <span class="correct-reveal">${phHTML(w.en)}</span><br><span class="muted">照着正确拼写打一遍,拼对才能继续 ↓</span>`;
  speak(w.en, 0.6);
}

function checkSpell(){
  const w=S.queue[S.idx];
  const input=document.getElementById('spell');
  const fb=document.getElementById('fb');
  if(!input) return;
  const val=input.value.trim();
  if(!val) return;

  // 订正模式:必须拼对才放行
  if(S.correcting){
    if(normSpell(val) === normSpell(w.en)){
      S.correcting=false;
      input.classList.add('ok'); input.disabled=true;
      fb.innerHTML = `<span class="ok">✓ 订正完成!</span>`;
      setTimeout(advance, 700);
    } else {
      input.value=''; input.focus();
      fb.innerHTML = `<span class="bad">还不对,对照上面再拼一遍:</span> <span class="correct-reveal">${phHTML(w.en)}</span><br><span class="muted">照着正确拼写打一遍,拼对才能继续 ↓</span>`;
      speak(w.en, 0.6);
    }
    return;
  }

  const ok = normSpell(val) === normSpell(w.en);
  clearTimer();
  recordSpell(w, ok);
  if(ok){
    input.classList.add('ok'); input.disabled=true;
    fb.innerHTML = `<span class="ok">✓ 正确!</span>`;
    setTimeout(advance, 800);
  } else {
    enterCorrection(w, '✕ 错误。正确拼写:');
  }
}

function recordSpell(w, ok){
  const key = S.round===2?'r2':'r3';
  const cur = S.results[w.id][key];
  // 首次成绩记录;重做只在原来错误时更新为"订正过"(60分)
  if(cur===null) S.results[w.id][key] = ok?100:0;
  else if(cur===0 && ok) S.results[w.id][key] = 60;
  w._lastOk = ok;
}

function advance(){
  S.correcting = false;
  S.idx++;
  renderRound();
}

function nextRoundOrRetry(){
  // 本轮做完:错词重做一遍(只重做一次)
  const wrongs = S.queue.filter(w=>w._lastOk===false && !w._retried);
  if(S.round>=2 && wrongs.length){
    wrongs.forEach(w=>{w._retried=true; w._lastOk=undefined;});
    S.queue=[...wrongs]; S.idx=0;
    app.innerHTML = header('renderHome') + `<div class="stage" style="justify-content:center">
      <div class="round-name">错词订正 · ${wrongs.length} 个</div>
      <p class="muted" style="margin-bottom:20px">刚才拼错的单词再来一遍</p>
      <button class="btn btn-main" onclick="renderRound()">开始订正</button></div>`;
    return;
  }
  // 进入下一轮
  S.words.forEach(w=>{w._retried=false; w._lastOk=undefined;});
  if(S.mode==='review'){ finishReview(); return; }
  if(S.round<3){
    S.round++; S.idx=0; S.queue=[...S.words];
    const info=ROUND_INFO[S.round];
    app.innerHTML = header('renderHome') + `<div class="stage" style="justify-content:center">
      <div class="round-name">${info.name}</div>
      <p class="muted" style="margin-bottom:20px">${info.tip}</p>
      <button class="btn btn-main" onclick="renderRound()">开始</button></div>`;
  } else {
    S.round=4; renderPaper();
  }
}

/* ---------- 第四轮:纸面默写 + 批改 ---------- */
function renderPaper(){
  clearTimer();
  app.innerHTML = header('renderHome') + `
    <div class="stage" style="align-items:stretch;text-align:left">
      <div style="text-align:center">
        <div class="round-tag">新学 · 最后一关</div>
        <div class="round-name">第四轮 · 纸上中译英</div>
      </div>
      <div class="card">
        <p class="muted" style="margin-bottom:6px">拿出纸笔,按下面的中文把英文<b style="color:var(--chalk)">写在纸上</b>(不要看屏幕提示):</p>
        <div class="paper-list">
          ${S.words.map((w,i)=>`<div class="paper-item"><span class="num">${i+1}.</span><span class="zh">${w.zh}</span></div>`).join('')}
        </div>
        <div style="text-align:center">
          <button class="btn btn-main" onclick="renderMark()">写好了,开始批改 ✍️</button>
        </div>
      </div>
    </div>`;
}

function renderMark(){
  app.innerHTML = header('renderHome') + `
    <div class="stage" style="align-items:stretch;text-align:left">
      <div style="text-align:center">
        <div class="round-name">批改 · 对照答案打分</div>
        <p class="muted">对照你纸上写的,每个单词标记 ✓ 或 ✕</p>
      </div>
      <div class="card">
        <div class="paper-list">
          ${S.words.map((w,i)=>`<div class="paper-item">
            <span class="num">${i+1}.</span>
            <span class="zh">${w.zh}</span>
            <span class="en">${w.en}</span>
            <span class="markbtns">
              <button class="mk" id="mk-ok-${w.id}" onclick="markPaper(${w.id},true)">✓</button>
              <button class="mk" id="mk-bad-${w.id}" onclick="markPaper(${w.id},false)">✕</button>
            </span>
          </div>`).join('')}
        </div>
        <div style="text-align:center">
          <button class="btn btn-main" id="finishBtn" disabled onclick="finishNew()">完成本组</button>
        </div>
      </div>
    </div>`;
}
function markPaper(id, ok){
  S.marks[id]=ok;
  S.results[id].r4 = ok?100:0;
  document.getElementById('mk-ok-'+id).className = 'mk'+(ok?' sel-ok':'');
  document.getElementById('mk-bad-'+id).className = 'mk'+(!ok?' sel-bad':'');
  document.getElementById('finishBtn').disabled = Object.keys(S.marks).length < S.words.length;
}

/* ---------- 完成 ---------- */
function groupScore(){
  let sum=0,n=0;
  S.words.forEach(w=>{
    const r=S.results[w.id];
    ['r1','r2','r3','r4'].forEach(k=>{ if(r[k]!=null){sum+=r[k];n++;} });
  });
  return n?Math.round(sum/n):0;
}

function finishNew(){
  const gid = state.nextId++;
  state.groups.push({
    id:gid, wordIds:S.words.map(w=>w.id),
    learnedAt:todayStr(), stage:0, nextDue:todayStr(1), graduated:false
  });
  saveState();
  const score=groupScore();
  const rows = S.words.map(w=>{
    const r=S.results[w.id];
    const avg=Math.round((['r1','r2','r3','r4'].reduce((s,k)=>s+(r[k]??0),0))/4);
    return `<div class="summary-word"><span class="en">${w.en}</span><span class="muted">${w.zh}</span><b style="color:${avg>=80?'var(--ok)':avg>=60?'var(--amber)':'var(--bad)'}">${avg}</b></div>`;
  }).join('');
  app.innerHTML = header() + `
    <div class="stage" style="justify-content:center">
      <div class="round-name">本组完成 🎉</div>
      <div class="score-big">${score}</div>
      <p class="muted" style="margin-bottom:16px">综合得分 · 明天(${todayStr(1)})进行第 1 次复习</p>
      <div class="card" style="width:100%;text-align:left">${rows}</div>
      <button class="btn btn-main" onclick="renderHome()">返回首页</button>
    </div>`;
}

function finishReview(){
  const g = state.groups.find(x=>x.id===S.gid);
  let ok=0;
  S.words.forEach(w=>{ if((S.results[w.id].r3??0)>=60) ok++; });
  const rate = Math.round(ok/S.words.length*100);
  const passed = rate>=80;
  let msg;
  if(passed){
    g.stage++;
    if(g.stage>=INTERVALS.length){ g.graduated=true; msg='🎓 五次复习全部通过,本组已牢记!'; }
    else { g.nextDue = todayStr(INTERVALS[g.stage]); msg=`✓ 通过!下次复习:${g.nextDue}(第 ${INTERVALS[g.stage]} 天)`; }
  } else {
    g.nextDue = todayStr(1);
    msg = `正确率不足 80%,明天(${g.nextDue})重新复习本阶段`;
  }
  saveState();
  app.innerHTML = header() + `
    <div class="stage" style="justify-content:center">
      <div class="round-name">复习完成</div>
      <div class="score-big">${rate}%</div>
      <p class="muted" style="margin:10px 0 20px">${msg}</p>
      <button class="btn btn-main" onclick="renderHome()">返回首页</button>
    </div>`;
}

/* ================= 启动 ================= */
(async ()=>{
  await loadState();
  try{ speechSynthesis.getVoices(); }catch(e){}
  renderHome();
})();
</script>
</body>
